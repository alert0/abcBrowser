name: Apostate Runtime Acceptance

on:
  push:
    branches:
      - feature/apostate-local-kernel
    paths:
      - '.github/workflows/apostate-runtime-acceptance.yml'
      - 'tools/apostate-runtime-acceptance/**'
      - 'src/main/engines/apostate/**'
      - 'src/main/browser-launcher.ts'
      - 'src/main/host-hardware.ts'
      - 'src/main/ipc.ts'
      - 'src/preload/index.ts'
      - 'src/renderer/src/ProfileEditor.tsx'
      - 'src/shared/apostate-profile*'
      - 'src/shared/hardware-profiles.ts'
      - 'src/shared/types.ts'
      - 'src/shared/validation.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime:
    name: Real Apostate Windows x64 runtime
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Microsoft Visual C++ Redistributable (x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw "VC++ Redistributable installer signature is not valid Microsoft code: $($signature.Status); $($signature.SignerCertificate.Subject)"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
          # 1638 means another version is already installed. Continue to the
          # real Apostate launch test, which verifies whether the runtime is usable.
          if ($process.ExitCode -notin @(0, 3010, 1638)) {
            throw "VC++ Redistributable installation failed with exit code $($process.ExitCode)"
          }
          Write-Host "PASS Microsoft VC++ Redistributable x64 installer (exit $($process.ExitCode)); 1638 means an existing version will be validated by runtime acceptance."

      - name: Run pinned Apostate v0.5.1 acceptance
        shell: pwsh
        run: ./tools/apostate-runtime-acceptance/run.ps1

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apostate-runtime-acceptance
          path: ${{ runner.temp }}/apostate-native-acceptance/evidence.json
          if-no-files-found: warn
          retention-days: 14
